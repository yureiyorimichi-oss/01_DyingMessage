<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>にゃんいんぐメッセージ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    /* 9:16比率を保持して画面いっぱいに収める */
    #unity-canvas {
      aspect-ratio: 9 / 16;
      width: 100% !important;
      height: 100% !important;
      max-width: calc(100vh * (9 / 16)) !important;
      max-height: calc(100vw * (16 / 9)) !important;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920"></canvas>
  </div>

  <!-- Unity WebGL Loader Script -->
  <script src="Build/dyingmessage.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    var config = {
      dataUrl: "Build/dyingmessage.data.unityweb",
      frameworkUrl: "Build/dyingmessage.framework.js.unityweb",
      codeUrl: "Build/dyingmessage.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "01_DyingMessage",
      productVersion: "1.0",
      // UnityによるDOMサイズの勝手な同期・変更を無効化する設定
      matchWebGLToCanvasSize: false,
    };

    createUnityInstance(canvas, config).then((unityInstance) => {
      // インスタンス作成後に強制サイズ指定（px）を削除しCSSに制御を任せる
      canvas.style.removeProperty("width");
      canvas.style.removeProperty("height");
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
