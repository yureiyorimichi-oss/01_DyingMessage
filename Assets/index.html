<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ダイイングメッセージメーカー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Unity Canvasを9:16比率で画面中央に最大化表示 */
    #unity-canvas {
      aspect-ratio: 9 / 16;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (9 / 16));
      max-height: calc(100vw * (16 / 9));
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <canvas id="unity-canvas" width="1080" height="1920"></canvas>

  <!-- Unity WebGL Loader Script -->
  <script src="Build/dyingmessage.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/dyingmessage.data.unityweb",
      frameworkUrl: "Build/dyingmessage.framework.js.unityweb",
      codeUrl: "Build/dyingmessage.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "01_DyingMessage",
      productVersion: "1.0",
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
